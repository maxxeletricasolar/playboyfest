<style>
/* Layout: one centered column, a framed invitation card, names on equal footing, then date, place and a map button. */
:root{
  --bg:#0f2a25;
  --bg-glow:#1f4a40;
  --fg:#f1e8d2;
  --fg-dim:#b9ae93;
  --gold:#e2c27a;
  --gold-d:#a8863f;
  --on-gold:#0f2a25;
  --f-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-script:'Great Vibes','Snell Roundhand',cursive;
  --f-label:'Oswald','Arial Narrow',Arial,sans-serif;
  --f-body:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse 90% 40% at 50% 12%,var(--bg-glow) 0%,var(--bg) 62%);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;min-height:100%}
.card{max-width:520px;margin:0 auto;border:1.5px solid var(--gold-d);padding:8px}
.card-in{border:1px solid rgba(168,134,63,.45);padding:clamp(24px,6vw,44px) 20px clamp(24px,6vw,40px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.orn{display:flex;align-items:center;gap:14px;margin-bottom:clamp(16px,4vw,28px)}
.orn i{display:block;width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:10px;height:10px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--gold-d)}
h1{margin:0;font-family:var(--f-display);line-height:1;color:var(--gold);text-wrap:balance;font-weight:700}
h1 .a{display:block;font-size:clamp(40px,12.5vw,76px);letter-spacing:.06em}
h1 .b{display:block;font-size:clamp(40px,12.5vw,76px);font-weight:400;font-style:italic;color:var(--fg);letter-spacing:.2em;margin-top:0}
.invite{margin:0 0 clamp(10px,3vw,16px);font:500 clamp(14px,4.2vw,18px)/1 var(--f-label);letter-spacing:.28em;text-transform:uppercase;color:var(--fg)}
.lead{margin:14px 0 0;font-family:var(--f-display);font-style:italic;font-size:clamp(15px,4.4vw,19px);color:var(--fg-dim)}
.names{margin-top:clamp(16px,4vw,30px);display:flex;flex-direction:column;align-items:center}
.nm{display:flex;align-items:baseline;justify-content:center;gap:10px;white-space:nowrap}
.n{font-family:var(--f-display);font-size:clamp(32px,9.5vw,56px);line-height:1.05}
.tag{font-family:var(--f-display);font-style:italic;font-size:clamp(17px,5vw,21px);color:var(--gold)}
.amp{font-family:var(--f-script);font-size:clamp(36px,10vw,54px);line-height:1;color:var(--gold-d);margin:2px 0}
.rule{width:180px;height:1px;margin:clamp(18px,4.5vw,34px) 0 clamp(16px,4vw,28px);background:linear-gradient(90deg,transparent,var(--gold-d),transparent)}
.when{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:10px clamp(8px,3vw,18px);white-space:nowrap;font-family:var(--f-label);font-weight:500;font-size:clamp(19px,6.2vw,32px);letter-spacing:.1em;color:var(--gold);line-height:1}
.when span{flex:none;width:1px;height:22px;background:var(--gold-d)}
.venue{margin:clamp(14px,4vw,24px) 0 0;font-family:var(--f-display);font-size:clamp(19px,5.6vw,23px);line-height:1.25;text-wrap:balance}
.addr{margin:6px 0 0;font-style:normal;font-size:clamp(13px,3.8vw,15px);line-height:1.5;color:var(--fg);opacity:.85;letter-spacing:.03em;text-wrap:balance}
.addr .nb{white-space:nowrap}
.actions{margin-top:clamp(16px,4.5vw,28px);display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 16px;font:700 14px/1 var(--f-body);letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1.5px solid var(--gold);transition:background .2s,color .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn-main{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 18px rgba(226,194,122,.25)}
.btn-main:hover{background:var(--fg)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.feat{margin-top:clamp(18px,5vw,34px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-size:12px;font-weight:700;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
.feat span+span:before{content:"";display:inline-block;width:6px;height:6px;margin-right:14px;background:var(--gold-d);transform:rotate(45deg);vertical-align:middle}
/* Effects: staggered entrance, gold shimmer on the title, button sheen, floating sparkles. All off when the visitor prefers reduced motion. */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes sheen{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(226,194,122,.25)}50%{box-shadow:0 6px 26px rgba(226,194,122,.5)}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-105vh,0) scale(1);opacity:0}}
.card{position:relative;z-index:1}
.card-in>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.card-in>*:nth-child(1){animation-delay:.05s}.card-in>*:nth-child(2){animation-delay:.2s}.card-in>*:nth-child(3){animation-delay:.35s}.card-in>*:nth-child(4){animation-delay:.55s}.card-in>*:nth-child(5){animation-delay:.7s}.card-in>*:nth-child(6){animation-delay:.85s}.card-in>*:nth-child(7){animation-delay:1s}.card-in>*:nth-child(8){animation-delay:1.15s}.card-in>*:nth-child(9){animation-delay:1.25s}.card-in>*:nth-child(10){animation-delay:1.4s}.card-in>*:nth-child(11){animation-delay:1.55s}
h1 .a{background:linear-gradient(100deg,var(--gold) 38%,#fff3cf 50%,var(--gold) 62%) 150% 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s ease-in-out 1.6s infinite}
.btn-main{position:relative;overflow:hidden;animation:rise .9s cubic-bezier(.2,.7,.2,1) 1.4s both,glow 3s ease-in-out 2.4s infinite}
.btn-main:after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 4.5s ease-in-out 2.4s infinite}
.sparks{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sparks i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fff3cf 0%,var(--gold) 45%,transparent 70%);opacity:0;animation:drift var(--d) linear var(--l) infinite}
@media (prefers-reduced-motion:reduce){.card-in>*,.btn-main,.btn-main:after,h1 .a{animation:none!important}.sparks{display:none}h1 .a{background:none;-webkit-text-fill-color:currentColor}}
@media (max-width:420px){.feat{flex-direction:column;align-items:center;gap:6px;font-size:11px}.feat span+span:before{display:none}}
::selection{background:var(--gold);color:var(--on-gold)}
</style>

</head>
<body>
<main class="card"><div class="card-in">
  <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
  <p class="invite">Você está convidado!</p>
  <h1><span class="a">PLAYBOY</span><span class="b">FEST</span></h1>
  <p class="lead">Aniversário dos irmãos</p>
  <div class="names">
    <div class="nm"><span class="n">Marcelo</span><span class="tag">Lima</span></div>
    <div class="amp" aria-hidden="true">&amp;</div>
    <div class="nm"><span class="n">Fernanda</span><span class="tag">Lima</span></div>
  </div>
  <div class="rule" aria-hidden="true"></div>
  <div class="when"><div>DOMINGO</div><span aria-hidden="true"></span><div>18.10.26</div><span aria-hidden="true"></span><div>12H</div></div>
  <p class="venue">Jardins Poty Eventos</p>
  <address class="addr" id="addr">Rua Joca Broxado, 919 · <span class="nb">Três Andares</span><br>Teresina — PI</address>
  <div class="actions">
    <a class="btn btn-main" id="maps" href="https://maps.app.goo.gl/cmcyMmwve5pURXgE8" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      Como chegar
    </a>
  </div>
  <div class="feat"><span>Bandas ao vivo</span><span>Piscina liberada</span></div>
</div></main>

<div class="sparks" id="sparks" aria-hidden="true"></div>
<script>
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var box=document.getElementById('sparks'),n=18;
  for(var i=0;i<n;i++){
    var e=document.createElement('i'),s=Math.random()*5+3;
    e.style.cssText='left:'+(Math.random()*100)+'%;--s:'+s+'px;--d:'+(9+Math.random()*10)+'s;--l:-'+(Math.random()*14)+'s;--dx:'+((Math.random()*80-40))+'px;--o:'+(Math.random()*.5+.35);
    box.appendChild(e);
  }
})();
</script>
</body>
</html>
